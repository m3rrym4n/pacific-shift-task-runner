name: Dev Build and Deploy

on:
  push:
    branches: [dev]
    paths:
      - 'orchestrator/**'
      - '.github/workflows/dev-build-deploy.yml'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Force failure after replacement to verify rollback
        type: boolean
        default: false

jobs:
  deploy:
    uses: m3rrym4n/pacific-shift-ci/.github/workflows/build-deploy-verify.yml@main
    with:
      runner_labels: '["self-hosted", "zimaos", "variflex"]'
      image_repository: pacific-shift/variflex
      container_name: variflex-dev
      app_url: http://192.168.1.68:6004
      health_path: /
      build_context: orchestrator
      dockerfile: orchestrator/Dockerfile
      build_args: |
        TASK_RUNNER_SOURCE_SHA=${{ github.sha }}
      simulate_failure: ${{ inputs.simulate_failure || false }}
    secrets: inherit
